<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

<header>

        <nav aria-label="Main navigation">

            <a href="privacy.html" data-i18n="menu.privacy"></a>
            <a href="support.html" data-i18n="menu.support"></a>
            <a href="contact.html" data-i18n="menu.contact"></a>
            <div class="language-switch">
                <button onclick="setLanguage('it'); location.reload();" aria-label="Italiano">
                    <img src="assets/images/flags/flag_it.png" alt="Italiano">
                </button>
                <button onclick="setLanguage('en'); location.reload();" aria-label="English">
                    <img src="assets/images/flags/flag_en.png" alt="English">

            </div>
        </nav>
    </div>
</header>

        <p data-i18n="support.intro"></p>

    <section class="content">

        <ul>
            <li>
                <strong>Sport Checklist</strong>

            <li>

            </li>
            <li>

            </li>
        </ul>

        <h3 data-i18n="support.dataStored"></h3>
        <p data-i18n="support.dataStoredAnswer"></p>

        <h3 data-i18n="support.changedPhone"></h3>

        <ul>

            <li data-i18n="support.androidVersion"></li>

            <li data-i18n="support.screenshots"></li>

        <h2 data-i18n="support.contactSupport"></h2>
        <p><span data-i18n="support.contactSupportIntro"></span> <strong><a data-email></a></strong></p>
